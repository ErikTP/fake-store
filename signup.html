<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skapa konto</title>
    <link rel="stylesheet" href="css/signup.css">
    <script src="scripts/signup.js" defer></script>
</head>

<body>
    <div class="link-signup">
        <ul> 
            <li><a href="login.html">Tillbaka</a></li>
        </ul>
    </div>

    <form id="signupForm" class="signup-form">
        <h1>Skapa konto</h1>
        <input type="text" id="username" class="signup-input" placeholder="Användarnamn" required>
        <input type="password" id="password" class="signup-input" placeholder="Lösenord" required>
        <button type="submit" class="signup-button">Skapa konto</button>
    </form>

</body>
</html>
